services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: sim
      POSTGRES_DB: sim
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d sim"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://sim:sim@db:5432/sim?sslmode=disable
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully

  seeder:
    build: ./backend
    environment:
      DATABASE_URL: postgres://sim:sim@db:5432/sim?sslmode=disable
      SEED_CSV: /data/FastFoodNutritionMenuV2.csv
      SEED_ONLY: "1"
    volumes:
      - ../PROYECTO FINAL:/data:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: http://localhost:8080
    environment:
      PUBLIC_API_URL: http://backend:8080
    ports:
      - "4322:4321"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
